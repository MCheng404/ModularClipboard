[package]
name = "modular-clipboard-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
modular-clipboard-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ash = { workspace = true }
bytemuck = { workspace = true }
# window.rs 需要把 Win32 事件翻译成 egui 的 RawInput，
# 这是 UI 层与渲染层之间唯一的耦合点，由本 crate 持有以避免循环依赖。
egui = { workspace = true }
# tray_probe 需要验证托盘常驻（托盘实现在 platform 层）。
# 只被example 使用，不进渲染库本身。
modular-clipboard-platform = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    # window.rs 的键鼠事件转换需要
    "Win32_UI_Input_KeyboardAndMouse",
    # DPI 感知：SetProcessDpiAwarenessContext
    "Win32_UI_HiDpi",
] }

[[example]]
name = "probe"

[[example]]
name = "pipeline_probe"

[[example]]
name = "upload_probe"

# 首次真实绘制验证（1 帧，1 次 draw call）
[[example]]
name = "draw_probe"

# 端到端：egui 界面真正显示出来
[[example]]
name = "full_app"

# 窗口与事件循环实机验证（无渲染，退出码 0 = 正常）
[[example]]
name = "window_probe"

# 托盘常驻 + 全局快捷键实机验证（无渲染，退出码 0 = 正常）
[[example]]
name = "tray_probe"

# 着色器在编译期由 naga 编译为 SPIR-V，不进最终二进制。
# 这样无需 glslc / glslang 等 C++ 工具链，保持纯 Rust 构建链。
[build-dependencies]
naga = { version = "25", features = ["wgsl-in", "spv-out"] }
