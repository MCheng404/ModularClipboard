[package]
name = "modular-clipboard-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
modular-clipboard-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ash = { workspace = true }
bytemuck = { workspace = true }
# window.rs 需要把 Win32 事件翻译成 egui 的 RawInput，
# 这是 UI 层与渲染层之间唯一的耦合点，由本 crate 持有以避免循环依赖。
egui = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    # window.rs 的键鼠事件转换需要
    "Win32_UI_Input_KeyboardAndMouse",
    # IME：顶栏搜索框要能输入中文。没有这一项时
    # WM_IME_CHAR 拿不到候选结果，用户只能打英文/数字。
    "Win32_UI_Input_Ime",
    "Win32_Globalization",
    # DPI 感知：SetProcessDpiAwarenessContext
    "Win32_UI_HiDpi",
    # chrome.rs 的 Win11 圆角：DwmSetWindowAttribute
    # （在 windows 0.62 里它只依赖 Win32_Graphics，是纯增量，不会
    #   因为 feature 交集问题影响其它 crate）
    "Win32_Graphics_Dwm",
] }

# 着色器在编译期由 naga 编译为 SPIR-V，不进最终二进制。
# 这样无需 glslc / glslang 等 C++ 工具链，保持纯 Rust 构建链。
[build-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
