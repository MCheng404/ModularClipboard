[package]
name = "modular-clipboard-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
modular-clipboard-core = { workspace = true }
modular-clipboard-capture = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
arboard = { workspace = true }
# 托盘图标是内嵌的 PNG（assets/tray.png），启动时解码一次。
image = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # system_langid()：常驻进程要自己解析界面语言（托盘菜单）。
    # 早先只有 ui 开了这个 feature，靠 feature 统一才编得过；
    # 单独 `cargo test -p modular-clipboard-app` 会露馅。
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # lib.rs ensure_dpi_awareness：SetProcessDpiAwarenessContext。
    # 缺了它迷你面板的屏幕坐标会被 DPI 虚拟化，菜单偏到右下角。
    "Win32_UI_HiDpi",
    # tray.rs：Shell_NotifyIconW / NOTIFYICONDATAW
    "Win32_UI_Shell",
    # tray.rs：CreateDIBSection / CreateBitmap 构造程序化图标
    "Win32_Graphics_Gdi",
] }
