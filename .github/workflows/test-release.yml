name: 发布测试版

# 自动构建并发布**测试版**（GitHub 预发布）。
#
# 触发：
#   - push 到 main      → 滚动更新预发布 `test-latest`（常驻下载入口）
#   - workflow_dispatch → 可指定 tag 快照一份（如 test-20261022），否则同上
#
# 为什么是滚动 tag：
#   测试版只有一个下载入口，永远指向最新构建，不用在列表里翻。
#   需要留档时用 dispatch 指定 tag，或手动把某次产物下载保存。
#
# 产物约定与本地一致（scripts/package.sh）：
#   modular-clipboard.exe / BUILD_INFO.txt / SHA256SUMS.txt
#   测试不过（test 步骤失败）就不会发布——产物与质量门禁原子绑定。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（留空 = 滚动 test-latest）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: test-release
  # 不取消在途构建：每一次都是一份要发布的产物，取消会丢构建。
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 Rust（stable, MSVC）
        run: |
          rustup update stable --no-self-update
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: 测试（不过不发布）
        run: ./scripts/build.sh --test

      - name: 打包（dist 三件套）
        run: ./scripts/build.sh --package

      # 万一 release 步骤失败，也保留 90 天的 run 内产物可下载。
      - uses: actions/upload-artifact@v4
        with:
          name: modular-clipboard-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: 发布 GitHub 预发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'test-latest' }}
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=12 HEAD)
          NOW=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          {
            echo "## 测试版 $VERSION · $SHORT"
            echo
            echo "- 构建时间：$NOW (UTC+8)"
            echo "- 触发：\`${{ github.event_name }}\` / [run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 提交：\`${SHORT}\` (${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- 测试与 clippy 全绿后自动发布"
            echo
            echo "### BUILD_INFO.txt"
            echo '```'
            cat dist/BUILD_INFO.txt
            echo '```'
            echo
            echo "### SHA256SUMS.txt"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

          # 滚动发布：先删旧 release + tag，再在当前提交上重建。
          # （gh 不支持「把已有 release 的 tag 挪到新提交」，删建是
          #   官方推荐的滚动 tag 做法。）
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            dist/modular-clipboard.exe \
            dist/BUILD_INFO.txt \
            dist/SHA256SUMS.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "测试版 $VERSION ($SHORT)" \
            --notes-file notes.md

          echo "已发布：$TAG"
