[workspace]
resolver = "2"
members = [
    "crates/tiez-core",
    "crates/tiez-store",
    "crates/tiez-capture",
    "crates/tiez-platform",
    "crates/tiez-app",
    "crates/tiez-gfx",
    "crates/tiez-ui",
    "crates/tiez-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tiez-core = { path = "crates/tiez-core" }
tiez-store = { path = "crates/tiez-store" }
tiez-capture = { path = "crates/tiez-capture" }
tiez-platform = { path = "crates/tiez-platform" }
tiez-app = { path = "crates/tiez-app" }
tiez-gfx = { path = "crates/tiez-gfx" }
tiez-ui = { path = "crates/tiez-ui" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rtrb = "0.4"

rusqlite = { version = "0.40", features = ["bundled", "backup"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
directories = "6.0"
sha2 = "0.10"

arboard = "3.6"
global-hotkey = "0.8"
trash = "5.2"

egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11"] }

ash = { version = "0.38", features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
