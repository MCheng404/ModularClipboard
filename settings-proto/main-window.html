<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板管理器 · 主窗口视觉原型</title>
<style>
/* ==========================================================================
   设计 Token —— 与 crates/modular-clipboard-ui/src/theme.rs 的 palette! 宏
   一一对应。改这里的值，等价于改 Rust 侧的 token。
   NOTE: 这是原型工具，不参与构建；正式取值仍以 theme.rs 为准。
   ========================================================================== */
:root {
  /* ---- 背景层 ---- */
  --bg:             #f2f4f7;
  --surface:        #fafbfc;
  --surface-variant:#eceff3;
  --list-bg:        #e8ebf0;
  --surface-raised: #ffffff;

  /* ---- 描边层 ---- */
  --border:         #7c8692;
  --border-strong:  #4a5562;
  --border-subtle:  #dde2e8;

  /* ---- 文本层 ---- */
  --text:           #24292e;
  --text-dim:       #545454;
  --text-bright:    #0f0f0f;
  --text-on-accent: #ffffff;

  /* ---- 状态色 ---- */
  --accent:         #1d65af;
  --accent-hover:   #1464b8;
  --accent-active:  #0c64c0;
  --success:        #307b43;
  --danger:         #b42d31;
  --danger-hover:   #c11f24;
  --warn:           #906419;
  --info:           #257593;

  /* ---- 交互态底色（半透明，叠在 surface-raised 上）---- */
  --row-hover:      rgba(0,0,0,.102);
  --row-selected:   rgba(29,101,175,.204);
  --row-active:     rgba(0,0,0,.204);

  /* ---- 圆角 ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;

  /* ---- 圆角风格 ----
     CAUTION: --win-radius 在原型里**不能随便调**，它表达的是系统给的值。

     DWMWA_WINDOW_CORNER_PREFERENCE 只收 4 个枚举（微软 dwmapi.h）：
         DWMWCP_DEFAULT=0 / DONOTROUND=1 / ROUND=2 / ROUNDSMALL=3
     ——**没有 DWMWCP_ROUNDLARGE**，也不存在 DWMWA_WINDOW_CORNER_RADIUS
     之类的属性能请求任意半径。ROUND 已经是最"large"的一档（约 8px），
     半径烧在 dwm.exe 里。

     所以「窗口圆角更大」在 Win32 层面**做不到**，除非改用
     SetWindowRgn + CreateRoundRectRgn —— 代价是四角锯齿（区域裁剪
     无抗锯齿）、DWM 阴影消失、每次 resize 都要重新应用。不划算。

     于是「整体更圆润」只能靠**内容层**承担：卡片与行取更大的半径，
     窗口圆角作为最外层固定值。这里按真实值渲染，不是示意。 */
  --win-radius:   8px;   /* DWM DWMWCP_ROUND，系统定，改不了 */
  --card-radius: 16px;   /* Rust: CARD_RADIUS，现为 0 —— 视觉主体 */
  --row-radius:  12px;   /* Rust: 行卡片现用 pal.radius_sm = 4 */
  /* 卡片内边距 ≥ 卡片圆角，否则行卡片的方角会从圆角底下露出来。
     取 17（比 16 大 1）而不是相等：相切时行卡片边缘正好落在圆角
     切点上，亚像素舍入会让它偶尔露出一点点方角。 */
  --card-pad:    17px;
  --cardarea-pad: 8px;
  --row-pad:     12px;   /* 行卡片左右内边距（Rust: pad_v 的横向版，目前无对应值）*/

  /* ---- 间距 ---- */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;

  /* ---- 字号（逻辑点）---- */
  --font-xs:   11px;
  --font-sm:   12px;
  --font-md:   14px;
  --font-lg:   16px;

  /* ---- 控件尺寸 ---- */
  --control-height: 28px;
  --icon-size:      16px;

  /* ---- 布局常量（paint.rs / solver.rs）---- */
  --topbar-h:      44px;
  --list-pad-x:    8px;
  --row-gap:       6px;
  --row-min-h:     58px;
  --scrollbar-reserve: 10px;
  --search-expand-w:   140px;
  --card-stroke:   1px;
  --card-radius:   0px;
}
[data-theme="dark"] {
  --bg:             #14161a;
  --surface:        #1e2127;
  --surface-variant:#262a31;
  --list-bg:        #101215;
  --surface-raised: #2e333b;
  --border:         #6e7886;
  --border-strong:  #9ca6b4;
  --border-subtle:  #2a2f36;
  --text:           #e3e6e8;
  --text-dim:       #c2c2c2;
  --text-bright:    #fcfcfc;
  --text-on-accent: #0a0d12;
  --accent:         #84b7eb;
  --accent-hover:   #7eb6f1;
  --accent-active:  #79b6f6;
  --success:        #a0daae;
  --danger:         #e28d8f;
  --danger-hover:   #eb8487;
  --warn:           #ebc98e;
  --info:           #95cfe4;
  --row-hover:      rgba(255,255,255,.118);
  --row-selected:   rgba(132,183,235,.220);
  --row-active:     rgba(255,255,255,.204);
}

/* ==========================================================================
   原型外壳（不属于应用，仅为调阅方便）
   ========================================================================== */
* { box-sizing: border-box; }
body {
  margin: 0; background: #101216; color: #e6e8ec;
  font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
}
.shell { display: grid; grid-template-columns: minmax(0,1fr) 420px; height: 100vh; }
.stage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; overflow: auto; padding: 20px;
  background:
    radial-gradient(circle at 50% 0%, #1b1f27 0%, #101216 70%);
}
.inspector {
  border-left: 1px solid #262a33; overflow: auto; background: #15181e;
  display: flex; flex-direction: column;
}
.inspector h2 {
  margin: 0; padding: 12px 16px; font-size: 13px; letter-spacing: .4px;
  border-bottom: 1px solid #262a33; color: #9aa4b2; text-transform: uppercase;
}
.tabs { display: flex; border-bottom: 1px solid #262a33; }
.tabs button {
  flex: 1; background: none; border: 0; color: #79828f; padding: 9px 4px;
  cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent;
}
.tabs button.on { color: #7fb2e8; border-bottom-color: #7fb2e8; }
.tabpane { display: none; padding: 14px 16px 40px; }
.tabpane.on { display: block; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: #15181e; border-bottom: 1px solid #262a33;
}
.toolbar label { color: #79828f; font-size: 12px; display: flex; gap: 6px; align-items: center; }
select, input[type=number] {
  background: #1e2127; color: #e6e8ec; border: 1px solid #2e333b;
  border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px;
}
button.chip {
  background: #1e2127; color: #9aa4b2; border: 1px solid #2e333b;
  border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px;
}
button.chip.on { background: #1c3350; color: #8fc0f2; border-color: #2f5480; }
.scale-hint { color: #5c6572; font-size: 11px; }
.note-line { color: #6f7885; font-size: 11px; }
.note-line b { color: #8fc0f2; font-weight: 500; }

/* ---- 桌面场景：用来演示「置顶」到底改变了什么 ----
   置顶的语义是 z 序，不是外观。光看窗口截图看不出区别，
   所以这里摆两个「别的程序窗口」，让遮挡关系可见。 */
/* 高度按「窗口 533 逻辑点 × 1.5 缩放 = 800」留够，否则主窗口会被裁顶，
   而顶栏（含新增的置顶按钮）恰好最先被裁掉。 */
/* 桌面要比窗口大出一圈：置顶时两个假窗口被压在下面，**必须还能从
   主窗口边缘露出来**，否则「置顶」和「没置顶」两张图看起来一样。
   640 − 48(padding) = 592，窗口 480 居中后左右各余 56 —— 够露出一角。 */
.desktop {
  position: relative; width: 640px;
  padding: 24px;
  background: linear-gradient(160deg, #2b3a52 0%, #1b2434 55%, #14202e 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.other-win {
  position: absolute; background: #22262c; color: #8b93a0;
  border: 1px solid #333944; border-radius: 8px; padding: 10px 12px;
  font-size: 11px; box-shadow: 0 6px 22px rgba(0,0,0,.45);
}
.other-win b { display: block; color: #aeb6c2; font-size: 11px; margin-bottom: 6px; font-weight: 500; }
.other-win .lines { display: flex; flex-direction: column; gap: 5px; }
.other-win .lines i { display: block; height: 5px; background: #333944; border-radius: 3px; }
/* 固定像素定位，不用百分比：百分比相对 padding box，而 box 宽度会
   随视口变，假窗口就会跑出「露出多少」的可控范围。 */
.ow-a { left: 6px;  top: 14px;  width: 200px; z-index: 3; }
.ow-b { right: 6px; bottom: 14px; width: 190px; z-index: 3; }
/* 主窗口：置顶时压在其它窗口之上（z 4），不置顶时被它们压住（z 2） */
.app-wrap { position: relative; z-index: 2; transition: z-index 0s; }
.desktop.pinned .app-wrap { z-index: 4; }
/* 不置顶时，让 ow-a 明确压住主窗口左上角——一眼看出「没置顶」 */
.desktop:not(.pinned) .ow-a { z-index: 5; }
.pin-badge {
  position: absolute; left: 12px; bottom: 10px; z-index: 6;
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  background: #16202c; color: #6f7885; border: 1px solid #2a3441;
}
.desktop.pinned .pin-badge { color: #8fc0f2; border-color: #2f5480; background: #16283d; }

/* ==========================================================================
   应用窗口（严格按 Rust 的绘制顺序与几何）
   ========================================================================== */
.app {
  /* 应用内所有尺寸都是「逻辑点」；外层用 zoom 表达 DPI 缩放 */
  width: var(--win-w, 480px);
  height: var(--win-h, 533px);
  border-radius: var(--win-radius);
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 18px 60px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
}

/* ---- 顶栏 ---- */
.topbar {
  height: var(--topbar-h); flex: 0 0 var(--topbar-h);
  background: var(--surface-variant);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center;
  padding: 0 var(--space-md);
  position: relative;
}
.tb-drag { flex: 1 1 auto; height: 100%; align-self: stretch; }
.tb-search { flex: 0 0 auto; margin-right: var(--space-md); }
/* 顶栏按钮的几何来自 draw_topbar_icons，三层尺寸各不相同，别混。
   现在有 **4** 枚（新增「窗口置顶」），btn_count 与 step 的分母必须
   同时从 3 改到 4 —— Rust 侧这两个数字写在两处（btn_area 与
   draw_topbar_icons 的 step），改一处忘另一处 ⇒ 按钮与实际热区错位。

     btn   = topbar_h × 0.62                  = 27.28  （btn_area 基准）
     容器宽 = btn×4 + gap×3，gap = space_sm×2 = 16 → 157.12
     step  = 容器宽 / 4                         = 39.28  （slot 步距）
     热区  = step × 0.62                        = 24.35  ← 实际可点区域
     字形  = icon_size                          = 16     ← 比热区小一圈 */
.tb-buttons {
  flex: 0 0 auto;
  width: calc(var(--topbar-h) * .62 * 4 + var(--space-sm) * 2 * 3);
  display: flex; justify-content: space-between;
}
.tb-btn {
  width: calc((var(--topbar-h) * .62 * 4 + var(--space-sm) * 2 * 3) / 4 * .62);
  height: calc((var(--topbar-h) * .62 * 4 + var(--space-sm) * 2 * 3) / 4 * .62);
  border: 0; background: transparent; color: var(--text-dim);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  border-radius: var(--radius-sm);
}
.tb-btn svg { width: var(--icon-size); height: var(--icon-size); }
.tb-btn:hover { background: var(--row-hover); color: var(--text); }
.tb-btn.danger:hover { color: var(--danger); background: var(--row-hover); }
/* 「窗口置顶」是开关态按钮：激活时用 accent 高亮。
   只用实心/描边图钉区分是不够的 —— 16pt 下形状差异太小，
   不配色的话分不出「已置顶」和「没置顶」。 */
.tb-btn.active { color: var(--accent); }
.tb-btn.active:hover { color: var(--accent-hover); }
.searchbox {
  width: var(--search-expand-w); height: calc(var(--topbar-h) - 2 * var(--space-sm));
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  display: flex; align-items: center; padding: 0 var(--space-sm);
  font-size: var(--font-md); color: var(--text);
}
.searchbox input {
  width: 100%; border: 0; background: none; outline: none;
  color: inherit; font: inherit; padding: 0;
}
.searchbox input::placeholder { color: var(--text-dim); }
.tb-searchicon {
  width: 17px; height: 17px; border: 0; background: none; padding: 0;
  color: var(--text-dim); cursor: pointer; display: grid; place-items: center;
  margin-right: var(--space-md); border-radius: var(--radius-sm);
}
.tb-searchicon:hover { color: var(--text); background: var(--row-hover); }

/* ---- 卡片区 ---- */
/* NOTE: 现有实现里 card_area 是「顶栏之下到窗口底部」，**没有内边距**，
   卡片直接贴到窗口边缘（gap 默认 0）。直角风格下这没问题；
   一旦窗口有了圆角，卡片四角（自绘 10px）与窗口四角（DWM 12px）
   会错开，边缘露出两道弧。

   这里改为卡片内缩 space_sm(8)：两套系统都对 ——
   Win11 有 DWM 圆角时是「窗口圆角 → 缝 → 卡片圆角」的层次，
   Win10 没有 DWM 圆角时卡片圆角依然成立。
   Rust 侧对应改动：card_area() 加内边距。 */
.cardarea {
  flex: 1 1 auto; min-height: 0; background: var(--bg); display: flex;
  padding: 0 var(--cardarea-pad) var(--cardarea-pad);
}
.card {
  flex: 1 1 auto; min-width: 0;
  background: var(--list-bg);              /* 历史整卡 = 暗容器 */
  border: var(--card-stroke) solid var(--border-subtle);
  border-radius: var(--card-radius);
  display: flex; flex-direction: column;
  /* 圆角后内容必须让开圆角区域，否则行卡片的方角会从圆角底下露出来。
     内边距 ≥ 圆角半径是硬要求：--card-pad(14) > --card-radius(12)。 */
  padding: var(--card-pad);
}
/* 列表内容整体也要裁进圆角里，否则第一行/最后一行会压到圆角上 */
.list {
  border-radius: calc(var(--card-radius) - var(--card-pad) + 4px);
}
.card-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

/* ---- 内嵌置顶区 ---- */
/* 内嵌置顶区已移除 —— 置顶条目与普通条目共用一个列表。
   代价：Rust 侧 draw_embedded_pinned / embedded_pinned_height /
   draw_history_body(only_pinned) 的双滚动槽位逻辑都可以删掉。 */

/* ---- 列表 ---- */
.list {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--list-pad-x) var(--space-sm);
  display: flex; flex-direction: column; gap: var(--row-gap);
  scrollbar-width: thin;
}
/* ---- 现代滑动条（overlay · 静止隐形 · 悬停淡入）----
   这是当下的主流做法（macOS / Win11 / 各家现代 Web 组件库一致）：
   不用时完全不出现，鼠标进入可滚动区域才淡入。

   布局预留仍是 SCROLLBAR_RESERVE(10)——必须对齐 egui 的
   ScrollStyle::floating().bar_width，这个值不能改（行内按钮的右基准
   靠它避让）。视觉宽度用 `border + background-clip` 收窄到 4px：
   **热区仍是 10，滑块只有 4**，好抓又好看。

   三级反馈：
     静止     → 完全透明（列表干净）
     列表悬停 → 细滑块淡入
     滑块悬停 → 加深 + 加粗到 6px（抓住的反馈）
*/
.list::-webkit-scrollbar { width: var(--scrollbar-reserve); background: transparent; }
.list::-webkit-scrollbar-track { background: transparent; }
.list::-webkit-scrollbar-thumb {
  /* 常态**微可见**而不是全透明 —— 全透明的滚动条在内容溢出时
     会被忽略，用户不知道「下面还有」，反而要拖一下才知道。
     主流搜索站点（Bing / Google）也是常驻低透明、悬停加深。 */
  background: color-mix(in srgb, var(--border) 38%, transparent);
  border-radius: 999px;
  /* 3.5px 的边框把 10px 轨道挖成 3px 视觉宽度；同时让滑块两端
     各留 3.5px，不顶到轨道头尾。 */
  border: 3.5px solid transparent;
  background-clip: content-box;
  transition: background-color .18s ease, border-width .18s ease;
}
.list:hover::-webkit-scrollbar-thumb,
.list.scrolling::-webkit-scrollbar-thumb,
.list.force-scrollbar::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--border) 72%, transparent);
}
.list::-webkit-scrollbar-thumb:hover {
  background: var(--border-strong);
  border-width: 2.5px;                 /* → 5px，比常态粗一档 */
}
/* Firefox：scrollbar-width 只有 auto/thin/none 三档，给不了具体宽度，
   但 scrollbar-color 支持 transparent，同样能做出「悬停才显形」。 */
.list {
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--border) 38%, transparent) transparent;
}
.list:hover, .list.scrolling, .list.force-scrollbar {
  scrollbar-color: color-mix(in srgb, var(--border) 72%, transparent) transparent;
}

/* ---- 行卡片 ---- */
.row {
  position: relative; flex: 0 0 auto;
  background: var(--surface-raised);
  border: var(--card-stroke) solid var(--border-subtle);
  border-radius: var(--row-radius);
  /* 右缘让出滚动条：egui 的 floating scrollbar 覆盖右缘 10pt，
     不让开的话最后一个按钮会被滚动条压住 */
  margin-right: calc(var(--scrollbar-reserve) - var(--list-pad-x));
  /* 左右内边距：原先是 `5px 0`，文字直接**贴死卡片左右边缘**，
     视觉上像是溢出了卡面。现在给 --row-pad(12)，三段文字都离边有距离。 */
  padding: 5px var(--row-pad);
  min-height: var(--row-min-h);
  cursor: default;
  transition: border-color .14s ease, background-color .14s ease,
              box-shadow .14s ease;
}
.row:hover, .row.hover { background: color-mix(in srgb, var(--surface-raised) 100%, var(--row-hover)); }

/* 选中：**围绕卡片**高亮 —— 整圈 accent 描边 + 极淡底色 + 轻微外扩光晕。
   不再用左侧 2px 竖条：竖条是「通栏行列表」时代的做法，卡片化之后
   它贴在圆角卡片的最左端、跟着圆角切线走，视觉上像"贴了张便签"，
   反而把卡片切成了两半。整圈描边才符合「这张卡被选中了」的语义。 */
.row.sel {
  border-color: var(--accent);
  border-width: 2px;
  padding: 4px 0;                 /* 描边从 1→2 时不改变内容位置 */
  background: color-mix(in srgb, var(--surface-raised) 100%, var(--row-selected));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
/* 行内操作区：热区 btn = control_height×0.55 = 15.4，字形 btn×0.78 ≈ 12。
   实现里 x = r.max.x − acts_w + (i+0.5)*(btn+space_xs)，i=0 是 pin，
   所以自左向右是 pin → copy → delete，delete 在最右。
   DOM 按 delete,copy,pin 写，配 row-reverse 得到同样的视觉顺序。

   位置有 4 种方案（工具栏可切换），差别在于「贴右上角」还是
   「居中」，以及「常驻」还是「悬停才出现」：

     top      贴右上角，与「来源 · 时间」同一水平线
     topgap   贴右上角，但整体再下移一点，避开来源行的字形上沿
     center   右侧垂直居中（与左侧类型图标对齐）
     hover    贴右上角，且**只在悬停该行时**出现

   位置不影响 text_x1 —— 那一律要减去 acts_w，否则长来源名会排到
   按钮底下（preview_width 里已经减过了，别在这里再减一次）。 */
.row-acts {
  position: absolute; right: var(--row-pad);
  display: flex; flex-direction: row-reverse; gap: var(--space-xs);
  transition: opacity .14s ease, transform .14s ease;
}
.row[data-acts="top"]     .row-acts { top: 5px; }
.row[data-acts="topgap"]  .row-acts { top: 9px; }
.row[data-acts="center"]  .row-acts { top: 50%; transform: translateY(-50%); }
.row[data-acts="hover"]   .row-acts { top: 5px; opacity: 0; }
.row[data-acts="hover"]:hover .row-acts { opacity: 1; }
.row-act {
  width: 15.4px; height: 15.4px; border: 0; background: none; padding: 0;
  color: var(--text-dim); cursor: pointer; display: grid; place-items: center;
  border-radius: 3px;
}
.row-act svg { width: 12px; height: 12px; }
.row-act:hover { color: var(--text-bright); background: var(--row-hover); }
.row-act.del:hover { color: var(--danger); }

/* 类型图标已移除：左边缘 24pt 的 icon_w 全部让给文字。
   类型信息本来就在右下角「类型 · 大小」那行，再放一枚图标是重复表达。 */
.row-text {
  margin-left: 0;
  /* 右边界 = padding + acts_w。按同样的公式推：

       按钮容器  right = --row-pad(12)，总宽 acts_w = 58.2
       按钮区左缘 = r.max.x − 12 − 58.2
       文本区右缘 = r.max.x − 12(padding) − 58.2(acts_w)   ← 两者重合

     所以长来源名被省略号截断时，**恰好停在按钮左缘**，不重叠。 */
  margin-right: calc(3 * (var(--control-height) * .55 + var(--space-xs)));
}
/* CAUTION: 这里原来写的是 `display: flex; align-items: center`，
   但 **`text-overflow: ellipsis` 在 flex 容器上不生效** —— 它只作用于
   块容器的行内内容。结果就是长来源名（C:\Program Files\...）不省略、
   直接溢出卡面。垂直居中改用 line-height，不影响 ellipsis。 */
.row-meta-top {
  font-size: var(--font-xs); color: var(--text-dim);
  line-height: 11px; height: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-preview {
  font-size: var(--font-md); color: var(--text); line-height: 1.35;
  margin: 2px 0; word-break: break-word;
}
.row.sel .row-preview { color: var(--text-bright); }
.row-meta-bot {
  font-size: var(--font-xs); color: var(--text-dim);
  line-height: 11px; height: 11px;
  text-align: right;                     /* 右对齐，不再用 flex */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ==========================================================================
   置顶标记：置顶条目与普通条目在同一个列表里，只靠视觉区分
   ==========================================================================

   四种方案，`data-pinmark` 可切换：

     tone     底色微亮（accent 低透明叠加）+ 边框转 accent 30%
     badge    底色微亮 + 左上角一枚小图钉徽标
     edge     底色微亮 + 左侧 3pt 圆头竖条
     sort     不加任何标记，只靠"置顶的排最前"这个位置信息

   默认用 tone：标记要一眼可辨，但不能抢过选中态（整圈 accent 描边）。
   置顶是**状态**、选中是**焦点**，两者同时出现时焦点必须更强。 */
.row[data-pin="1"] { background: color-mix(in srgb, var(--surface-raised) 100%, var(--accent) 7%); }
[data-theme="dark"] .row[data-pin="1"] { background: color-mix(in srgb, var(--surface-raised) 100%, var(--accent) 12%); }

/* tone / badge / edge 都带底色微亮；纯 sort 方案不要底色 */
.row[data-pin="1"][data-pinmark="sort"] { background: transparent; }
.app.unity .row[data-pin="1"] { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04); }

/* badge：左上角一枚小图钉。放在「来源 · 时间」之前，不占独立列。 */
.row[data-pin="1"][data-pinmark="badge"] .pin-badge-icon {
  position: absolute; left: var(--row-pad); top: 5px;
  width: 11px; height: 11px; color: var(--accent);
}
/* 徽标占 11pt，加上一点间隙 → meta-top 让出 14pt */
.row[data-pin="1"][data-pinmark="badge"] .row-meta-top { padding-left: 14px; }

/* edge：左侧短竖条。
   CAUTION: 不能做成「上下顶满、与左边缘齐平」的通条 —— 卡片是圆角的，
   方顶竖条会从圆角切线**探出来**，形成一个直角凸起（实测很明显）。
   上下各内缩 10pt、两端圆头才是「一枚竖条贴在卡片内侧」的样子。 */
.row[data-pin="1"][data-pinmark="edge"]::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
  border-radius: 3px; background: var(--accent);
}

/* ---- 空态 ---- */
.empty {
  flex: 1 1 auto; display: grid; place-items: center;
  color: var(--text-dim); font-size: var(--font-md);
}

/* ==========================================================================
   一体性（unity）：把「四层灰」压成「一层底 + 浮起的卡片」
   ==========================================================================

   现状读起来是四块拼的：

       窗口底  bg              #f2f4f7
       顶栏    surface_variant #eceff3    ← 第二种灰
       卡片区  list_bg        #e8ebf0    ← 第三种灰，且比窗口底**更暗**
       行卡片  surface_raised #ffffff    ← 第四种，且最亮

   三个相邻区域用了三种灰，再加一道 1px 描边把它们切开 —— 界面就
   「碎」了。用户的反馈正是这个。

   一体性版本的思路：**取消色块分割，改用浮起**。

       整窗一块底（顶栏 / 卡片区同色，只靠 1px 分隔线区分顶栏）
       行卡片浮在上面（浅色用阴影，深色用更亮的底 + 微光描边）

   层次仍然分得清（阴影 / 圆角 / 留白），但不再靠"这块比那块浅一点"
   来划分 —— 那是最容易显得廉价的手法。 */
.app.unity .topbar { background: var(--bg); }
.app.unity .card   { background: transparent; border-color: transparent; box-shadow: none; }
.app.unity .row {
  border-color: transparent;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
.app.unity .row:hover, .app.unity .row.hover {
  box-shadow: 0 2px 6px rgba(0,0,0,.09), 0 6px 16px rgba(0,0,0,.06);
}
.app.unity .row.sel {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent),
              0 2px 8px rgba(0,0,0,.07);
}
/* 深色下阴影几乎不可见，"浮起"改由更亮的底色承担。 */
[data-theme="dark"] .app.unity .topbar { background: var(--bg); }
[data-theme="dark"] .app.unity .row {
  border-color: color-mix(in srgb, var(--text) 8%, transparent);
  box-shadow: none;
}
[data-theme="dark"] .app.unity .row:hover, [data-theme="dark"] .app.unity .row.hover {
  background: color-mix(in srgb, var(--surface-raised) 100%, var(--row-hover));
  border-color: color-mix(in srgb, var(--text) 14%, transparent);
}
[data-theme="dark"] .app.unity .row.sel {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--surface-raised) 100%, var(--row-selected));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}

svg { display: block; }
.insp h3 { margin: 16px 0 6px; font-size: 12px; color: #7fb2e8; }
.insp h3:first-child { margin-top: 0; }
.insp p, .insp li { color: #9aa4b2; font-size: 12px; line-height: 1.65; margin: 4px 0; }
.insp ul { margin: 4px 0; padding-left: 18px; }
.insp code {
  background: #1e2127; padding: 1px 5px; border-radius: 3px;
  color: #8fc0f2; font-size: 11px;
}
.insp table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
.insp th, .insp td {
  text-align: left; padding: 4px 6px; border-bottom: 1px solid #22262e; vertical-align: top;
}
.insp th { color: #79828f; font-weight: 500; }
.insp td:first-child { color: #cfd5dd; white-space: nowrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px;
          vertical-align: -1px; border: 1px solid #3a3f48; }
.tree { font-family: Consolas, monospace; font-size: 11.5px; line-height: 1.6; color: #9aa4b2; }
.tree b { color: #8fc0f2; font-weight: 500; }
.tree .k { color: #6f7885; }
.tokenrow { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.tokenrow input { width: 88px; }
</style>
</head>
<body>
<div class="shell">
  <div class="stage">
    <div class="toolbar" style="background:none;border:0;padding:0">
      <label>主题
        <select id="themeSel">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <label>窗口(逻辑点)
        <input type="number" id="winW" value="480" min="240" max="900" step="10" style="width:70px">
        ×

      </label>
      <span class="scale-hint">1:1 逻辑点显示。默认配置 720×800 物理像素 ÷ DPI 1.5 = 480×533 逻辑点</span>

    <div class="toolbar note" style="background:none;border:0;padding:0">

        圆角梯度 <b>窗口 8（系统锁定，调不了）</b> → <b>卡片 16</b> → <b>行 12</b>。
        DWM 的 `DWMWCP_ROUND` 已是最大一档，微软枚举里没有更大的值。
      </span>
    </div>

    <div class="toolbar" style="justify-content:center;background:none;border:0;padding:0">
      <button class="chip on" data-state="normal">正常</button>
      <button class="chip" data-state="hover">悬停行</button>

    <div class="desktop" id="desktop">
      <div class="other-win ow-a"><b>记事本</b><div class="lines"><i></i><i style="width:70%"></i><i style="width:88%"></i></div></div>
      <div class="other-win ow-b"><b>文件资源管理器</b><div class="lines"><i></i><i style="width:60%"></i><i style="width:75%"></i><i style="width:40%"></i></div></div>
      <div class="app-wrap"><div class="app" id="app"></div></div>
      <div class="pin-badge" id="pinBadge">未置顶 —— 会被其它窗口盖住</div>
    </div>
  </div>

  <aside class="inspector">
    <h2>规范</h2>
    <div class="tabs">
      <button class="on" data-tab="tree">组件树</button>
      <button data-tab="tokens">Token</button>
      <button data-tab="interact">交互</button>
      <button data-tab="states">状态</button>
    </div>

    <div class="tabpane on insp" id="tab-tree"></div>
    <div class="tabpane insp" id="tab-tokens"></div>
    <div class="tabpane insp" id="tab-interact"></div>
    <div class="tabpane insp" id="tab-states"></div>
  </aside>
</div>

<script>
/* ==========================================================================
   图标：自绘 SVG，形状对应 crates/modular-clipboard-ui/src/icons.rs 的 Icon 枚举。
   之所以不用 Unicode 字形：早前用 ⧉ / ✕ 在当前字体链里没有字形，渲染成 tofu。
   ========================================================================== */
const ICON = (() => {
  const s = (p, extra = '') =>
    `<svg width="100%" height="100%" viewBox="0 0 16 16" fill="none" stroke="currentColor"
       stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
  return {
    /* 顶栏 */
    minimize: s('<path d="M3 8.5h10"/>'),                       // 「关闭到托盘」= 收起，用横线不用叉
    trash:    s('<path d="M2.5 4h11M6 4V2.6h4V4M4 4l.7 9.4h6.6L12 4M6.4 6.4v4.6M9.6 6.4v4.6"/>'),
    settings: s('<circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8L3.5 3.5"/>'),
    search:   s('<circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5l3.4 3.4"/>'),
    /* 行内操作 */
    pinSolid: s('<path d="M6 1.8h4l-.6 4.2 2.6 2.4H4l2.6-2.4z"/><path d="M8 8.4v5.8"/>', 'fill="currentColor"'),
    pinOutline: s('<path d="M6 1.8h4l-.6 4.2 2.6 2.4H4l2.6-2.4z"/><path d="M8 8.4v5.8"/>'),
    file:     s('<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/>'),
    close:    s('<path d="M4 4l8 8M12 4l-8 8"/>'),
    /* 类型图标已移除（原 kindText / kindCode / kindImage / kindFiles）：
       类型信息在右下角「类型 · 大小」那行已经表达，左侧再挂一枚图标
       是重复，而且要占 24pt 宽度（icon_w），白白吃掉文本空间。 */
  };
})();

/* ==========================================================================
   夹具数据
   ========================================================================== */
const FIX = {
  rows: [
    { app: 'C:\\Program Files\\Microsoft VS Code\\insiders\\Code.exe', time: '01:23', text: 'let total = rows.iter().filter(|r| r.ok).map(|r| r.v).sum::<f64>();', kind: '文本', size: '1.2 KB' },
    { app: 'Code.exe', time: '01:23', text: 'let total = rows.iter().filter(|r| r.ok).map(|r| r.v).sum::<f64>();', kind: '文本', size: '1.2 KB' },
    { app: 'idea64.exe', time: '00:58', text: 'D:\\dev\\project\\src\\main\\java\\com\\example\\service\\ClipboardMonitor.java', kind: '文件', size: '38.4 KB' },
    { app: '浏览器', time: '00:41', text: '<div class="card" data-id="42"><span>剪贴板</span></div>', kind: 'HTML', size: '86 B' },
    { app: 'Snipaste.exe', time: '00:12', text: '截图', kind: '图片', size: '284 KB' },
    { app: 'Windows Terminal', time: '23:57', text: 'cargo build --release --workspace --lib --tests', kind: '文本', size: '54 B' },
    { app: 'Figma.exe', time: '23:40', text: 'https://figma.com/design/clipboard-manager-token-spec/Design?node-id=1284%3A7712', kind: '文本', size: '102 B' },
    { app: '资源管理器', time: '22:19', text: 'D:\\WorkBuddy\\剪贴板\\导出\\2026-10-10\\history.csv', kind: '文件', size: '1.1 MB' },
    { app: 'Obsidian.exe', time: '21:52', text: '## 设计 token 评审\n\n- 背景层：bg / surface / surface_variant / list_bg / surface_raised\n- 描边层：border / border_strong / border_subtle', kind: '文本', size: '640 B' },
    // 刻意放一条**长来源名**的行，用来确认文本区右边界：
    // preview_width() 里减掉了右上操作区的宽度，所以这里会被
    // elide 截断成省略号，而不会排到按钮底下。
    // （我一度以为这里会重叠，读了 preview_width 才发现不是——删掉按钮区。
    //   这类"看起来像 bug"的判断，先读代码再下结论。）
    { app: 'C:\\Program Files\\Microsoft VS Code\\insiders\\Code.exe', time: '01:23', text: 'let total = rows.iter().filter(|r| r.ok).map(|r| r.v).sum::<f64>();', kind: '文本', size: '1.2 KB' },
  ],
};
/* 置顶条目**就在同一份列表里**，只是带 pinned 标记 —— 不再单独分区。
   排序上置顶的排前面，所以「哪几条是置顶」一眼可见；
   视觉上另有标记方式可切换（见工具栏「置顶标记」）。 */
FIX.pinnedSeeds = [
  { app: '密码管理器', time: '今天', text: '常用验证码片段 · 一次性验证码', kind: '文本', size: '24 B' },
  { app: '终端', time: '昨天', text: 'export DATABASE_URL=postgres://localhost:5432/clip', kind: '文本', size: '62 B' },
];

/* ==========================================================================
   渲染
   ========================================================================== */
const state = {
  theme: 'light', view: 'normal', w: 480, h: 533,
  winPinned: false,   // 窗口置顶 = 始终在最上层，不被其它应用遮住
  rounded: true,      // 圆角风格（false = 现在的直角风格，便于对比）
  forceScroll: false, // 强制显示滚动条 —— headless 截图模拟不了 :hover
  actsPos: 'top',     // 行内按钮位置：top / topgap / center / hover
  unity: true,        // 一体性：整窗一块底，层次靠浮起而非色块分割
  pinMark: 'tone',    // 置顶标记方式：tone / badge / edge / sort
};

function rowHtml(item, i, mode) {
  // 置顶行的图钉按钮是**实心**（表示"当前已置顶，点一下取消"），
  // 普通行是描边。这是行内操作按钮，不是列表标记 —— 列表标记见下方标记方案。
  const isPin = !!item.pinned;
  const pinIcon = isPin ? ICON.pinSolid : ICON.pinOutline;
  const acts = `
    <div class="row-acts">
      <button class="row-act del" title="删除">${ICON.close}</button>
      <button class="row-act" title="复制">${ICON.file}</button>
      <button class="row-act" title="${isPin ? '取消置顶' : '置顶'}">${pinIcon}</button>
    </div>`;
  const meta = `${item.app} · ${item.time}`;
  let cls = 'row';
  if (mode === 'selected' && i === 2) cls += ' sel';
  if (mode === 'hover' && i === 4) cls += ' hover';
  return `<div class="${cls}" data-acts="${state.actsPos}"
       ${isPin ? `data-pin="1" data-pinmark="${state.pinMark}"` : ''}>
    ${acts}
    ${isPin && state.pinMark === 'badge' ? `<div class="pin-badge-icon">${ICON.pinSolid}</div>` : ''}
    <div class="row-text">
      <div class="row-meta-top">${meta}</div>
      <div class="row-preview">${item.text}</div>
      <div class="row-meta-bot">${item.kind}${item.size ? ' · ' + item.size : ''}</div>
    </div>
  </div>`;
}

function render() {
  const v = state.view;
  const narrow = v === 'narrow';
  const w = narrow ? 300 : state.w;
  const app = document.getElementById('app');
  app.classList.toggle('unity', state.unity);
  app.style.setProperty('--win-w', w + 'px');
  app.style.setProperty('--win-h', state.h + 'px');

  const searchOpen = v === 'search';
  const pinIcon = state.winPinned ? ICON.pinSolid : ICON.pinOutline;
  const topbar = `
    <div class="topbar">
      <div class="tb-drag"></div>
      ${searchOpen ? `<div class="tb-search"><div class="searchbox">
          <input placeholder="搜索历史…" value="clip"></div></div>` : ''}
      <button class="tb-searchicon" title="搜索">${ICON.search}</button>
      <div class="tb-buttons">
        <button class="tb-btn" title="关闭到托盘">${ICON.minimize}</button>
        <button class="tb-btn danger" title="清空全部历史">${ICON.trash}</button>
        <button class="tb-btn ${state.winPinned ? 'active' : ''}" id="pinBtn"
                title="${state.winPinned ? '取消窗口置顶' : '窗口置顶'}">${pinIcon}</button>
        <button class="tb-btn" title="设置">${ICON.settings}</button>
      </div>
    </div>`;

  let body;
  if (v === 'empty') {
    body = `<div class="card"><div class="card-body"><div class="empty">还没有剪贴板记录</div></div></div>`;
  } else {
    // 置顶条目与普通条目在**同一个列表**里，只有 pinned 标记不同。
    // 置顶的排前面 —— 顺带让"哪几条置顶了"变成位置信息，不需要标题栏。
    const showPinned = v === 'pinned';
    const items = showPinned
      ? [...FIX.pinnedSeeds.map(x => ({ ...x, pinned: true })), ...FIX.rows]
      : [...FIX.rows];
    const rows = items.map((r, i) => rowHtml(r, i, v === 'selected' || v === 'hover' ? v : 'normal')).join('');
    body = `<div class="cardarea"><div class="card">
      <div class="card-body">
        <div class="list${state.forceScroll ? ' force-scrollbar' : ''}">${rows}</div>
      </div>
    </div></div>`;
  }
  app.innerHTML = topbar + body;

  // 顶栏那枚置顶按钮在每次 render 后都是新节点，要重新挂监听。
  const pb = document.getElementById('pinBtn');
  if (pb) pb.addEventListener('click', () => {
    state.winPinned = !state.winPinned;
    document.getElementById('pinChk').checked = state.winPinned;
    syncDesktop();
    render();
  });

  // 滚动条：滚动时也显示（不只是悬停）。现代列表的惯例——
  // 用户正在滚，说明他需要知道滑块在哪；停下后自动淡回常态。
  document.querySelectorAll('.list').forEach(l => {
    let t = 0;
    l.addEventListener('scroll', () => {
      l.classList.add('scrolling');
      clearTimeout(t);
      t = setTimeout(() => l.classList.remove('scrolling'), 700);
    }, { passive: true });
  });
}

/* 置顶改变的是 z 序，不是外观 —— 靠桌面场景把它表达出来 */
function syncDesktop() {
  const d = document.getElementById('desktop');
  d.classList.toggle('pinned', state.winPinned);
  document.getElementById('pinBadge').textContent = state.winPinned
    ? '已置顶 —— 覆盖在其它窗口之上（含获得焦点时）'
    : '未置顶 —— 会被其它窗口盖住';
}

/* 圆角风格：改的是 3 个 token 变量。关掉它就能和现在的直角风格直接对比 */
function syncRound() {
  const app = document.getElementById('app');
  const set = (k, v) => app.style.setProperty(k, v);
  if (state.rounded) {
    // 与 :root 保持一致，且是**真实值**：窗口圆角 8 由 DWM 锁定，
    // 视觉主体交给卡片（16）与行（12）——三层圆角梯度 8 / 16 / 12。
    set('--win-radius', '8px');
    set('--card-radius', '16px');
    set('--row-radius', '12px');
    set('--card-pad', '17px');
    set('--row-pad', '12px');
  } else {
    set('--win-radius', '0px');
    set('--card-radius', '0px');
    set('--row-radius', '4px');
    set('--card-pad', '8px');
    set('--row-pad', '0px');
  }
}

function renderTokens() {
  const grid = document.getElementById('tokenGrid');
  let html = '';
  for (const [group, items] of TOKEN_GROUPS) {
    html += `<h3>${group}</h3>`;
    for (const [name, ...vals] of items) {
      const isColor = /^#/.test(vals[0]);
      const sw = isColor ? `<span class="swatch" style="background:var(--${name})"></span>` : '';
      html += `<div class="tokenrow">${sw}<code>${name}</code>` +
        vals.map((v, i) => {
          const key = i === 0 ? 'dark' : 'light';
          if (isColor) {
            return `<input type="color" data-tok="${name}" data-mode="${key}" value="${v}">`;
          }
          // 非颜色 token：深浅同值，只给一个输入框
          return i === 0
            ? `<input type="text" data-tok="${name}" data-mode="both" value="${v}" style="width:64px">`
            : '';
        }).join('') + `</div>`;
    }
  }
  grid.innerHTML = html;
  grid.querySelectorAll('input[data-tok]').forEach(inp => {
    inp.addEventListener('input', () => applyToken(inp.dataset.tok, inp.dataset.mode, inp.value));
  });
}

/* 深浅两套用的是同一个 CSS 变量名，所以「改深色值」不能写进 :root ——
   写 :root 会连浅色一起改掉。这里用一段动态 <style> 按 [data-theme]
   选择器分别覆盖，需要时可整段移除。 */
const tokenOverrides = {};
function applyToken(name, mode, value) {
  tokenOverrides[name] = tokenOverrides[name] || { dark: null, light: null, both: null };
  tokenOverrides[name][mode] = value;
  const o = tokenOverrides[name];
  const decl = [];
  if (o.both) decl.push(`--${name}:${o.both};`);
  else {
    if (o.dark) decl.push(`[data-theme="dark"] .app{--${name}:${o.dark};}`);
    if (o.light) decl.push(`[data-theme="light"] .app{--${name}:${o.light};}`);
  }
  let tag = document.getElementById('tok-' + name);
  if (!tag) { tag = document.createElement('style'); tag.id = 'tok-' + name; document.head.appendChild(tag); }
  tag.textContent = decl.join('\n');
}

  state.unity = e.target.checked; render();
});
document.getElementById('pinSel').addEventListener('change', e => {
  state.pinMark = e.target.value; render();
});

document.getElementById('winW').addEventListener('input', e => { state.w = +e.target.value; render(); });
document.getElementById('winH').addEventListener('input', e => { state.h = +e.target.value; render(); });

render();

/* URL hash 支持状态直达，便于批量截图与分享：
     列表视图  #normal #hover #selected #search #empty #narrow #pinned
     #pinned  含置顶条目          #wintop  窗口置顶（另一个东西）
     #dark      深色主题          #square  直角对照      #nounity  关掉一体性
     #sb        强制显示滚动条（截图模拟不了 :hover，只能这样验）
     置顶标记  #tone #badge #edge #sort
     行内按钮  #top #topgap #center #hover
   例：main-window.html#dark+wintop+pinned+badge+sb

   注意 `pinned` 与 `wintop` 是两件不同的事：
     pinned  = 列表里的**条目**被置顶
     wintop  = **窗口**本身置顶 */
(function applyHash() {
  const h = (location.hash || '').replace('#', '');
  if (!h) return;
  const parts = h.split(/[+,]/);
  const VIEWS = ['normal','hover','selected','search','empty','narrow','pinned'];
  const view = parts.find(p => VIEWS.includes(p));
  if (view) {
    state.view = view;
    document.querySelectorAll('.chip').forEach(x =>
      x.classList.toggle('on', x.dataset.state === view));
  }
  if (parts.includes('dark')) {
    state.theme = 'dark';
    document.documentElement.dataset.theme = 'dark';
    document.getElementById('themeSel').value = 'dark';
  }
  if (parts.includes('wintop')) {
    state.winPinned = true;
    document.getElementById('pinChk').checked = true;
  }
  if (parts.includes('square')) {
    state.rounded = false;
    document.getElementById('roundChk').checked = false;
  }
  if (parts.includes('sb')) {
    state.forceScroll = true;
    document.getElementById('sbChk').checked = true;
  }
  const acts = parts.find(p => ['top','topgap','center','hover'].includes(p));
  if (acts) {
    state.actsPos = acts;
    document.getElementById('actsSel').value = acts;
  }
  const pm = parts.find(p => ['tone','badge','edge','sort'].includes(p));
  if (pm) {
    state.pinMark = pm;
    document.getElementById('pinSel').value = pm;
  }
  if (parts.includes('nounity')) {
    state.unity = false;
    document.getElementById('unityChk').checked = false;
  }
  // headless 截图模拟不了 :hover，用这个把滚动条强行显形以便验证。
  if (parts.includes('scroll')) state.forceScroll = true;
  syncDesktop();
  render();
  syncRound();
})();
</script>
</body>
